<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#161b1a" />
    <script>
      // Dark by default; the home-screen toggle can switch to light. Set before first paint.
      try {
        if (localStorage.getItem("drunk-drawing-theme") === "light") {
          document.documentElement.dataset.theme = "light";
          document.querySelector('meta[name="theme-color"]').content = "#e8e5d9";
        }
      } catch {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Drunk Drawing" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Drunk Drawing</title>
  </head>
  <body>
    <main class="bad-draw">
      <header class="masthead">
        <h1>
          <button type="button" class="home-button" data-home aria-label="Drunk Drawing: back to the main menu">
            <img class="logo" src="/src/main-logo.png" alt="" />
          </button>
        </h1>
        <div class="masthead-buttons">
        <button
          type="button"
          class="settings-button"
          data-back
          aria-label="Back"
          title="Back"
          hidden
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5l-7 7 7 7" />
          </svg>
        </button>
        <button
          type="button"
          class="settings-button mute-toggle"
          data-mute-toggle
          aria-pressed="false"
          aria-label="Mute sound"
          title="Mute sound"
        >
          <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z" />
            <path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" />
          </svg>
          <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4Z" />
            <path d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
          </svg>
        </button>
        <button
          type="button"
          class="settings-button theme-toggle"
          data-theme-toggle
          aria-label="Switch to light mode"
          title="Switch to light mode"
        >
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" />
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" />
          </svg>
        </button>
        </div>
      </header>

      <section class="bad-draw-intro">
        <div class="kite-pair" aria-hidden="true" data-preview>
          <div class="sketch-preview sober">
            <canvas width="300" height="370" data-kite="sober"></canvas>
          </div>
          <div class="sketch-preview drunk">
            <canvas width="300" height="370" data-kite="drunk"></canvas>
          </div>
        </div>
        <div class="round-setup">
          <h2 data-heading></h2>
          <p data-description></p>
          <div class="setup-controls">
          <div class="difficulty" data-setup>
            <div
              class="difficulty-buttons"
              role="radiogroup"
              aria-label="Difficulty"
              data-difficulty
            >
              <button type="button" role="radio" aria-checked="false" value="easy">Easy</button>
              <button type="button" role="radio" aria-checked="true" value="medium">Medium</button>
              <button type="button" role="radio" aria-checked="false" value="hard">Hard</button>
            </div>
            <small data-difficulty-note></small>
          </div>
          <div class="actions">
            <strong class="secret-word" data-word hidden></strong>
            <button type="button" data-peek hidden>
              Hold to reveal
            </button>
            <button
              type="button"
              data-swap
              aria-label="Swap word"
              title="Swap word"
              hidden
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 8h13l-3.5-3.5M20 16H7l3.5 3.5" />
              </svg>
            </button>
            <button
              type="button"
              class="settings-button"
              data-settings
              aria-label="Settings"
              title="Settings"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M19.11 9.32 L21.76 9.82 L21.76 14.18 L19.11 14.68 L18.92 15.14 L20.44 17.36 L17.36 20.44 L15.14 18.92 L14.68 19.11 L14.18 21.76 L9.82 21.76 L9.32 19.11 L8.86 18.92 L6.64 20.44 L3.56 17.36 L5.08 15.14 L4.89 14.68 L2.24 14.18 L2.24 9.82 L4.89 9.32 L5.08 8.86 L3.56 6.64 L6.64 3.56 L8.86 5.08 L9.32 4.89 L9.82 2.24 L14.18 2.24 L14.68 4.89 L15.14 5.08 L17.36 3.56 L20.44 6.64 L18.92 8.86Z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <button type="button" class="primary" data-next>
              Continue
            </button>
            <button type="button" data-gallery-open hidden>
              Gallery · <span></span>
            </button>
          </div>
          </div>
        </div>
      </section>

      <p class="build-stamp" data-build></p>
      <p class="build-stamp" data-pwa-status role="status" hidden></p>

      <section class="bad-draw-play" hidden aria-label="Drawing round">
        <header class="round-bar">
          <div class="bad-draw-clock">
            <span>Time left</span><strong data-time role="timer"></strong>
          </div>
          <div class="drunk-meter" role="img" aria-label="Drunk meter: Sober">
            <span data-drunk>Sober</span>
            <div class="mug" aria-hidden="true">
              <div class="mug-inside"><div class="beer"></div></div>
            </div>
          </div>
        </header>
        <div class="paper-space">
          <div class="bad-draw-sheet">
            <canvas aria-label="Drawing paper"></canvas>
            <span class="bad-draw-cursor" aria-hidden="true" hidden></span>
            <span class="bad-draw-hic" aria-hidden="true">hic!</span>
            <div class="bad-draw-cover" data-cover hidden>
              <p data-cover-title>Time’s up, drawer!</p>
              <p>Pass it to your team. No peeking!</p>
              <button type="button" class="primary" data-show>Reveal</button>
            </div>
          </div>
        </div>
        <footer>
          <p data-hint>Drag your finger to draw</p>
          <div class="actions">
            <button type="button" data-undo>
              Undo · <span></span>
            </button>
            <button type="button" data-clear>
              Clear · <span></span>
            </button>
            <button type="button" class="primary" data-done hidden>
              Done drawing
            </button>
            <button type="button" class="primary" data-correct>
              Correct!
            </button>
          </div>
        </footer>
      </section>

      <section class="result-card" hidden aria-labelledby="result-heading">
        <p data-outcome></p>
        <h2 id="result-heading" data-answer></h2>
        <div class="snapshot-frame">
          <img class="bad-draw-snapshot" alt="Final drawing" />
          <canvas class="bad-draw-replay" aria-hidden="true" hidden></canvas>
        </div>
        <dl class="result-stats">
          <div>
            <dt>Points</dt>
            <dd data-score></dd>
          </div>
          <div>
            <dt>Time left</dt>
            <dd data-remaining></dd>
          </div>
        </dl>
        <div class="actions">
          <button type="button" data-replay>Replay</button>
          <button type="button" data-gallery-open>
            Gallery · <span></span>
          </button>
          <button type="button" class="primary" data-again>
            Play again
          </button>
        </div>
      </section>
    </main>

    <dialog class="bad-draw-dev" aria-labelledby="dev-title">
      <form method="dialog">
        <h2 id="dev-title">Settings</h2>
        <label class="bad-draw-dev-toggle">
          <input type="checkbox" data-reveal-mode />
          <span>Reveal Mode</span>
          <small>The drawer sketches alone, then passes it to the team to guess.</small>
        </label>
        <div class="bad-draw-dev-controls"></div>
        <div class="actions">
          <button type="button" data-dev-reset>Reset to preset</button>
          <button class="primary">Done</button>
        </div>
      </form>
    </dialog>
    <dialog class="gallery" aria-labelledby="gallery-title">
      <div class="gallery-list" data-gallery-list>
        <header>
          <h2 id="gallery-title">Tonight’s drawings</h2>
          <p data-gallery-summary></p>
        </header>
        <div class="gallery-grid" data-gallery-grid></div>
        <div class="actions">
          <button type="button" data-gallery-clear>Clear all</button>
          <button type="button" data-gallery-share-all>Share all</button>
          <button type="button" class="primary" data-gallery-close autofocus>Done</button>
        </div>
      </div>
      <div class="gallery-viewer" data-gallery-viewer hidden>
        <img data-gallery-big alt="" />
        <div class="actions">
          <button type="button" data-gallery-back>Back</button>
          <button type="button" class="primary" data-gallery-share>Share</button>
        </div>
      </div>
    </dialog>
    <script type="module" src="/src/badDraw.js"></script>
  </body>
</html>
